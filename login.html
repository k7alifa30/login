<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>login</title>
    <link rel="stylesheet" href="index.html">
    <link rel="stylesheet" href="sign-up.html">
    <link rel="stylesheet" href="css/login-style.css">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-log">
        <form action="" class="login-form" id="login">
            <h3 class="head-login">
                login
            </h3>
            <div class="form-log">
                <div class="user-name">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" autofocus placeholder="user name" required>
                </div>
                <div class="user-pass">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" placeholder="password" required>
                </div>
                <div class="log-click">
                    <input type="submit" value="login">
                </div>
                <div class="forgot-pass">
                        <a href="">forgotten password ?</a>
                    <a href="../html/sign-up.html">i don’t have account !</a>
                </div>
                <div class="hr"></div>
                <div class="another-opp">
                    <div class="google-acc">
                        <a href="">
                            <i class="fa-brands fa-google"></i>
                            <p>google</p>
                        </a>
                    </div>
                    <div class="facebook-acc">
                        <a href="">
                            <i class="fa-brands fa-facebook"></i>
                            <p>facebook</p>
                        </a>
                    </div>
                    <div class="mac-acc">
                        <a href="">
                            <i class="fa-brands fa-apple"></i>
                            <p>ios</p>
                        </a>
                    </div>
                </div>
            </div>
        </form>  
    </div>
</body>
</html>
