<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign-Up</title>
    <link rel="stylesheet" href="index.html">
    <link rel="stylesheet" href="login.html">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/sign-up.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;900&display=swap" rel="stylesheet">    
</head>
<body>
    <div class="signup-form">
        <h3>
            sign-up
        </h3>
        <form action="">
            <label for="name">full name</label>
            <input type="text" id="name" placeholder="name" autofocus required>
            <label for="email">email</label>
            <input type="email" name="" id="email" placeholder="email address" required>
            <label for="user">user name</label>
            <input type="text" name="" id="user" placeholder="username" required>
            <label for="pass">password</label>
            <input type="password" name="" id="pass" placeholder="password" required>
            <label for="repeat-pass">repeat password</label>
            <input type="password" name="" id="repeat-pass" placeholder="repeat password" required>
            <div class="terms-user">
                <input type="checkbox" name="" id="terms" required>
                <label for="terms">
                    i agree to the <a href="">terms of user</a>
                </label>
            </div>
            <input type="submit" value="sign up">
            <a href="../html/login.html" class="hav-acc">already have an account</a>
        </form>
    </div>
</body>
</html>
